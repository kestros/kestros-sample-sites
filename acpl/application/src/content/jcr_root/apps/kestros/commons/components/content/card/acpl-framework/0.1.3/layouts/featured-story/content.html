<div class="card featured-story border-0 shadow-sm mb-4 overflow-hidden">
    <div class="row g-0 align-items-stretch">
        <div class="col-md-6">
            <a href="${properties.href}"><img src="${properties.imageSrc}" alt="${properties.headline}" class="img-fluid w-100 h-100 featured-story-img"/></a>
        </div>
        <div class="col-md-6">
            <div class="card-body d-flex flex-column justify-content-center h-100 p-4">
                <p class="section-heading mb-2">${properties.category}</p>
                <h2 class="fw-bold mb-3"><a class="text-decoration-none text-reset" href="${properties.href}">${properties.headline}</a></h2>
                <p class="text-muted mb-0">${properties.excerpt}</p>
                <div class="mt-3 pt-3 border-top small text-muted d-flex justify-content-between align-items-center gap-2">
                    <p class="mb-0">${properties.byline}</p>
                    <a class="btn btn-primary btn-sm flex-shrink-0" href="${properties.href}" role="button">Read story →</a>
                </div>
            </div>
        </div>
    </div>
</div>
