<div class="match-header text-center py-4 mb-4">
    <div class="d-flex justify-content-center gap-2 small mb-3 acpl-crumb">
        <a href="${properties.base}.html" class="text-muted text-decoration-none">Home</a>
        <span class="text-muted">/</span>
        <a href="${properties.base}/results.html" class="text-muted text-decoration-none">Results</a>
        <span class="text-muted">/</span>
        <span class="text-muted">${properties.homeName} ${properties.score} ${properties.awayName}</span>
    </div>
    <div class="d-flex justify-content-center align-items-center gap-4">
        <a class="text-decoration-none d-flex flex-column align-items-center gap-2" href="${properties.base}/teams/${properties.homeSlug}.html">
            <img class="crest-xl" src="${properties.base}/assets/crests/${properties.homeSlug}.svg" alt="${properties.homeName} crest"/>
            <span class="fw-semibold">${properties.homeName}</span>
        </a>
        <span class="match-score display-4 fw-black">${properties.score}</span>
        <a class="text-decoration-none d-flex flex-column align-items-center gap-2" href="${properties.base}/teams/${properties.awaySlug}.html">
            <img class="crest-xl" src="${properties.base}/assets/crests/${properties.awaySlug}.svg" alt="${properties.awayName} crest"/>
            <span class="fw-semibold">${properties.awayName}</span>
        </a>
    </div>
    <p class="text-muted mt-3 mb-2">${properties.meta}</p>
    <a class="btn btn-sm btn-outline-primary" href="${properties.base}/results.html">← All results</a>
    <a class="btn btn-sm btn-primary ms-2" data-sly-test="${properties.reportHref}" href="${properties.reportHref}">Read the report →</a>
</div>
