<div class="hero-wrap">
    <img src="${properties.imageSrc}" alt="${properties.headline}" class="hero-img"/>
    <div class="hero-overlay">
        <div class="container">
            <p class="hero-category">${properties.category}</p>
            <h1 class="hero-headline">${properties.headline}</h1>
            <p class="hero-dek">${properties.excerpt}</p>
            <div class="mt-3 d-flex gap-2 flex-wrap">
                <a class="btn btn-secondary" href="${properties.href}" role="button">Read the full story</a>
            </div>
        </div>
    </div>
</div>
