<div class="hero-wrap">
    <img src="${properties.imageSrc}" alt="${properties.headline}" class="hero-img"/>
    <div class="hero-overlay">
        <div class="container">
            <div class="hero-block">
                <p class="hero-kicker">${properties.category}</p>
                <h1 class="hero-headline"><a href="${properties.href}">${properties.headline}</a></h1>
                <p class="hero-dek">${properties.excerpt}</p>
                <div class="hero-meta">
                    <span>${properties.byline}</span>
                    <a class="hero-cta" href="${properties.href}">Read the full story <span class="hero-cta-arrow">&#8594;</span></a>
                </div>
            </div>
        </div>
    </div>
</div>
