<div class="team-header">
    <div class="container">
        <div class="d-flex gap-2 small mb-2 acpl-crumb">
            <a href="${properties.base}.html" class="text-white-50 text-decoration-none">Home</a>
            <span class="text-white-50">/</span>
            <a href="${properties.base}/teams.html" class="text-white-50 text-decoration-none">Clubs</a>
            <span class="text-white-50">/</span>
            <span class="text-white-50">${properties.clubName}</span>
        </div>
        <div class="d-flex align-items-center gap-4">
            <img class="crest-xxl" src="${properties.base}/assets/crests/${properties.slug}.svg" alt="${properties.clubName} crest"/>
            <div>
                <h1 class="team-name mb-1">${properties.clubName}</h1>
                <p class="team-sub mb-1">${properties.place}</p>
                <p class="team-sub mb-2">${properties.meta}</p>
                <div class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-light" href="${properties.base}/results.html?club=${properties.slug}">All results →</a>
                    <a class="btn btn-sm btn-outline-light" href="${properties.base}/schedule.html?club=${properties.slug}">Fixtures →</a>
                </div>
            </div>
        </div>
    </div>
</div>
